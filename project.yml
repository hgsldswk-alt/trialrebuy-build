name: TrialRebuy
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
  knownRegions: [zh-Hans, en, zh-Hant]
settings:
  base:
    APP_ID: com.hgsldswk.trialrebuy
    APP_STORE_ID: ""
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  TrialRebuy:
    type: application
    platform: iOS
    sources: [TrialRebuy, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: TrialRebuy AppStore
    info:
      path: TrialRebuy/Info.plist
      properties:
        CFBundleDisplayName: 试用回购卡
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        APP_STORE_ID: $(APP_STORE_ID)
        NSCameraUsageDescription: 只用于拍摄产品包装，照片只存在本机。
        CFBundleLocalizations: [zh-Hans, en, zh-Hant]
  TrialRebuyTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TrialRebuyTests, Shared, TrialRebuy/LibraryDisk.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).tests
        GENERATE_INFOPLIST_FILE: YES
  TrialRebuyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [TrialRebuyUITests]
    dependencies:
      - target: TrialRebuy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: TrialRebuy
schemes:
  TrialRebuy:
    build:
      targets:
        TrialRebuy: all
        TrialRebuyTests: [test]
    test:
      config: Debug
      targets: [TrialRebuyTests]
  TrialRebuyUI:
    build:
      targets:
        TrialRebuy: all
        TrialRebuyUITests: [test]
    test:
      config: Debug
      targets: [TrialRebuyUITests]
